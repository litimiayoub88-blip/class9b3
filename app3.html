<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class9b3</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7f9;--card:#fff;--ink:#1e2a38;--mute:#66758a;--line:#e4e9ee;--c:#2a9d9d;--bad:#d64545;--ok:#2f8f6b;--soft:color-mix(in srgb,var(--c) 13%,var(--card))}
@media(prefers-color-scheme:dark){:root{--bg:#111922;--card:#1a2430;--ink:#e9eef4;--mute:#93a1b3;--line:#2a3644}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.6;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:460px;margin:0 auto;padding:24px 16px;text-align:center}
.logo{font-size:44px}
h1{margin:0;font-size:26px;font-weight:800}
h2{font-size:17px;margin:18px 0 8px;text-align:right}
.sub{color:var(--mute);margin:2px 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;text-align:right}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;margin-bottom:10px}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.btn{background:var(--c);color:#fff;border-radius:12px;padding:10px 16px;font-weight:600;width:100%}
.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.sm{width:auto;padding:4px 14px;font-size:14px}
.btn.bad{background:var(--bad)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.tabs button.on{background:var(--c);color:#fff;border-color:var(--c);font-weight:600}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-bottom:6px}
.err.ok{color:var(--ok)}
.or{text-align:center;color:var(--mute);margin:10px 0;font-size:13px}
.lnk{display:block;margin:10px auto 0;color:var(--mute);font-size:14px;text-decoration:underline}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mute{color:var(--mute);font-size:13px}
.tag{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--c);color:#fff;font-weight:600}
.who{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:6px 0;font-size:14px}
.ac{display:flex;gap:8px;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signInWithPopup,GoogleAuthProvider,sendPasswordResetEmail,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,onSnapshot,collection,serverTimestamp,writeBatch} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

var cfg={apiKey:"AIzaSyA-PayjxhG1V1zRD5gRUaMex9aXfvwSRI4",authDomain:"class9b3-app.firebaseapp.com",projectId:"class9b3-app",storageBucket:"class9b3-app.firebasestorage.app",messagingSenderId:"576372821233",appId:"1:576372821233:web:2e79fc6cf81fb624ddad50"};
var fa=initializeApp(cfg),auth=getAuth(fa),db=getFirestore(fa);
var DEV="أيوب اليتيمي",CHEF="Chef de la classe";
var app=document.getElementById("app");
var lastEmail="",mode="login",msg="",pendingName="",unsub=null,unsubList=null,isAdmin=false,me=null,list=null,claimed=true;
var T={"auth/invalid-credential":"البريد أو كلمة السر غير صحيحة.","auth/user-not-found":"لا يوجد حساب بهذا البريد.","auth/wrong-password":"كلمة السر غير صحيحة.","auth/email-already-in-use":"هذا البريد مسجّل من قبل، جرّب تسجيل الدخول.","auth/weak-password":"كلمة السر ضعيفة (6 أحرف على الأقل).","auth/invalid-email":"البريد الإلكتروني غير صالح.","auth/missing-password":"اكتب كلمة السر.","auth/network-request-failed":"لا يوجد اتصال بالإنترنت.","auth/too-many-requests":"محاولات كثيرة، انتظر قليلًا ثم أعد المحاولة.","auth/popup-closed-by-user":"أُغلقت نافذة Google قبل إتمام الدخول."};
function err(e){return (T[e.code]||"حدث خطأ")+" ["+(e.code||e.message||"unknown")+"]"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shell(inner){app.innerHTML='<div class="wrap"><div class="logo">📚</div><h1>Class9b3</h1><p class="sub">القسم 9 أساسي 3</p>'+inner+'</div>'}
function out(){return '<button class="lnk" data-a="out">تسجيل الخروج</button>'}

function authView(){
shell('<div class="tabs"><button data-m="login" class="'+(mode=="login"?"on":"")+'">تسجيل الدخول</button><button data-m="signup" class="'+(mode=="signup"?"on":"")+'">إنشاء حساب</button></div><div class="card">'+
(mode=="signup"?'<input id="nm" placeholder="الاسم واللقب" autocomplete="name">':'')+
'<input id="em" type="email" value="'+esc(lastEmail)+'" placeholder="البريد الإلكتروني" autocomplete="email"><input id="pw" type="password" placeholder="كلمة السر (6 أحرف على الأقل)" autocomplete="current-password">'+
'<div class="err '+(msg.charAt(0)=="✓"?"ok":"")+'">'+esc(msg)+'</div><button class="btn" data-a="go">'+(mode=="signup"?"إرسال طلب الانضمام":"دخول")+'</button>'+
'<div class="or">أو</div><button class="btn sec" data-a="gg">المتابعة بحساب Google</button>'+
(mode=="login"?'<button class="lnk" data-a="fp">نسيت كلمة السر؟</button>':'')+'</div>');
}

function waitView(u){shell('<div class="card"><h2 style="margin-top:0">⏳ طلبك قيد المراجعة</h2><p>مرحبًا <b>'+esc(me.name)+'</b>، وصل طلب انضمامك إلى المشرف. ستتمكن من الدخول بمجرد قبوله، فأعد فتح التطبيق لاحقًا.</p></div><div class="card"><div class="mute">معرّف حسابك (UID):</div><div dir="ltr" style="word-break:break-all;font-family:monospace;font-size:13px">'+esc(u.uid)+'</div></div>'+(claimed?"":'<div class="card"><b>هل أنت مشرف التطبيق؟</b><div class="mute" style="margin:4px 0 8px">يظهر هذا الخيار قبل تفعيل أول مشرف فقط، ويختفي بعدها نهائيًا.</div><input id="cc" type="password" placeholder="رمز الإعداد السري"><button class="btn" data-a="claim">تفعيل كمشرف</button></div>')+out())}
function rejView(){shell('<div class="card"><h2 style="margin-top:0">لم يُقبل الطلب</h2><p>لم يتم قبول طلب انضمامك. تواصل مع المشرف إن كان هذا خطأ.</p></div>'+out())}
function homeView(){shell('<div class="card"><h2 style="margin-top:0">مرحبًا '+esc(me.name)+' 👋</h2><p>أهلًا بك في <b>Class9b3</b>، منصّة القسم 9 أساسي 3: الدروس والواجبات والأخبار والجدول والمعدلات والتواصل في مكان واحد.</p><div class="who"><span class="mute">المطوّر</span><b>'+DEV+'</b></div><div class="who"><span class="mute">المسؤول</span><b>'+DEV+' • '+CHEF+'</b></div></div><div class="card"><span class="tag">قريبًا</span><p class="mute" style="margin:8px 0 0">الأقسام (الدروس، الأخبار، الجدول...) قيد البناء وستظهر هنا في التحديثات القادمة.</p></div>'+out())}

function adminView(u,users){
var p=users.filter(function(x){return x.status=="pending"&&x.id!=u.uid});
var a=users.filter(function(x){return x.status=="approved"&&x.id!=u.uid});
shell('<div class="card"><div class="row"><b>لوحة المشرف</b><span class="tag">'+CHEF+'</span></div><div class="mute">'+esc(me.name)+'</div></div>'+
'<h2>طلبات الانضمام ('+p.length+')</h2>'+(p.length?p.map(function(x){return '<div class="card"><b>'+esc(x.name)+'</b><div class="mute">'+esc(x.email)+'</div><div class="ac"><button class="btn sm" data-st="'+x.id+'|approved">قبول</button><button class="btn sm sec" data-st="'+x.id+'|rejected">رفض</button></div></div>'}).join(""):'<div class="mute" style="text-align:right">لا توجد طلبات جديدة.</div>')+
'<h2>الأعضاء المقبولون ('+a.length+')</h2>'+(a.length?a.map(function(x){return '<div class="card"><div class="row"><div><b>'+esc(x.name)+'</b><div class="mute">'+esc(x.email)+'</div></div><button class="btn sm bad" data-st="'+x.id+'|rejected">إيقاف</button></div></div>'}).join(""):'<div class="mute" style="text-align:right">لا يوجد أعضاء بعد.</div>')+out());
}

function route(u){
if(!me)return;
if(isAdmin){if(list)adminView(u,list);return}
if(me.status=="approved")homeView();else if(me.status=="rejected")rejView();else waitView(u);
}

onAuthStateChanged(auth,async function(u){
if(unsub){unsub();unsub=null}
if(unsubList){unsubList();unsubList=null}
if(!u){me=null;list=null;isAdmin=false;authView();return}
shell('<p class="sub">جارٍ التحميل...</p>');
try{
var ref=doc(db,"users",u.uid);
var s=await getDoc(ref);
if(!s.exists()){
var name=(pendingName||u.displayName||(u.email||"").split("@")[0]||"عضو").trim().slice(0,60);
await setDoc(ref,{name:name,email:u.email||"",status:"pending",createdAt:serverTimestamp()});
}
var adm=await getDoc(doc(db,"admins",u.uid));
isAdmin=adm.exists();
try{claimed=(await getDoc(doc(db,"meta","setup"))).exists()}catch(e){claimed=true}
unsub=onSnapshot(ref,function(snap){me=snap.data();route(u)},function(){shell('<div class="card">تعذّر تحميل حسابك.</div>'+out())});
if(isAdmin){
unsubList=onSnapshot(collection(db,"users"),function(qs){
var l=[];qs.forEach(function(d){var x=d.data();x.id=d.id;l.push(x)});
list=l;if(me)adminView(u,l);
});
}
}catch(e){shell('<div class="card">حدث خطأ في الاتصال. تأكد من الإنترنت وأعد فتح التطبيق.<div class="mute" dir="ltr">'+esc(e.code||e.message||"")+'</div></div>'+out())}
});

document.addEventListener("click",async function(e){
var b=e.target.closest("button");if(!b)return;
var d=b.dataset;
if(d.m){mode=d.m;msg="";authView();return}
if(d.st){var q=d.st.split("|");try{await updateDoc(doc(db,"users",q[0]),{status:q[1]})}catch(x){alert("تعذّر تنفيذ العملية.")}return}
if(d.a=="out"){await signOut(auth);return}
if(d.a=="claim"){var C=document.getElementById("cc").value.trim();if(!C){alert("اكتب رمز الإعداد.");return}
try{var cu=auth.currentUser;var bt=writeBatch(db);bt.set(doc(db,"meta","setup"),{by:cu.uid,createdAt:serverTimestamp()});bt.set(doc(db,"admins",cu.uid),{name:me?me.name:"",code:C});await bt.commit();location.reload()}catch(x){alert("لم تنجح العملية: الرمز غير صحيح أو تم تفعيل المشرف من قبل. ["+(x.code||"")+"]")}return}
var em=document.getElementById("em"),pw=document.getElementById("pw"),nm=document.getElementById("nm");
if(d.a=="go"){
var E=em.value.trim(),P=pw.value;lastEmail=E;
if(mode=="signup"){
var N=nm.value.trim();
if(N.length<3){msg="اكتب اسمك ولقبك.";authView();return}
pendingName=N;
}
if(!E||!P){msg="اكتب البريد وكلمة السر.";authView();return}
b.disabled=true;
try{
if(mode=="signup")await createUserWithEmailAndPassword(auth,E,P);
else await signInWithEmailAndPassword(auth,E,P);
}catch(x){msg=err(x);authView()}
return;
}
if(d.a=="gg"){
try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(x){msg=err(x);authView()}
return;
}
if(d.a=="fp"){
var E2=em.value.trim();
if(!E2){msg="اكتب بريدك أولًا ثم اضغط «نسيت كلمة السر».";authView();return}
try{await sendPasswordResetEmail(auth,E2);msg="✓ أرسلنا رابط استعادة كلمة السر إلى بريدك.";authView()}catch(x){msg=err(x);authView()}
}
});
</script>
</body>
</html>
